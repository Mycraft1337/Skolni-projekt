<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tennis Counter</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1 class="center_text">Tennis Counter</h1>    
    <div class="table">
        <div class="player">
            <span>Player1</span>
            <span id="score_1">0</span>
            <button id="add_button_1">Add point</button>
            <button id="subtract_button_1">Subtract point</button>
        </div>
        <div class="player">
            <span>Player2</span>
            <span id="score_2">0</span>
            <button id="add_button_2">Add point</button>
            <button id="subtract_button_2">Subtract point</button>
        </div>
    </div>
    <button class="center" id="button_reset">Reset</button>
</body>
</html>
